name: Feature request
description: Propose a focused workflow or decision improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the engineering decision or workflow gap.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and realistic examples
      description: Explain why the existing skill is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Native or open-source alternatives considered
