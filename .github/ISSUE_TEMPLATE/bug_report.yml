name: Bug report
description: Report incorrect routing, validation, or unsafe behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Realistic scenario
      description: Describe the request and relevant project conditions.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, and customer information.
          required: true
